name: Validate marketplace

# No path filters: `validate` is a required check, so it must run on every PR
# or docs-only PRs would wait forever on a check that never reports.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.288

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

      - name: Check skill descriptions are under 1024 characters
        run: python3 scripts/check_skill_descriptions.py
